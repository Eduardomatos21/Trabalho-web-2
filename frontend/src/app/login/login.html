<div class="min-h-screen flex items-center justify-center relative overflow-hidden">
	<div class="relative w-full max-w-5xl mx-auto px-4 py-10 md:py-14">
		<div class="grid lg:grid-cols-12 gap-6 items-center">

			<!-- Painel esquerdo -->
			<section class="lg:col-span-5">
				<div class="bg-linear-to-br from-teal-700 to-cyan-700 text-white rounded-2xl p-8 ">
					<div class="flex items-center gap-4 mb-8">
						<div class="w-12 h-12 rounded-2xl bg-white/20 flex items-center justify-center shrink-0">
							<svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round"
									d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
							</svg>
						</div>
						<h1 class="text-4xl font-black leading-tight">Bem-vindo</h1>
					</div>
					<p class="mt-3 text-sm leading-relaxed">
						Entre com seu e-mail e a senha de 4 dígitos enviada para você ao se cadastrar.
					</p>
				</div>

				<div class="mt-4 text-sm text-slate-600 text-center lg:text-left">
					Não possui conta?
					<a routerLink="/cadastro" class="font-semibold text-teal-700 hover:text-teal-800 hover:underline">Criar conta</a>
				</div>
			</section>

			<!-- Painel direito - formulário -->
			<section class="lg:col-span-7">
				<div class="bg-white rounded-3xl border border-slate-200 overflow-hidden">
					<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="p-6 md:p-10 space-y-6">

						<div>
							<h2 class="text-2xl font-bold text-slate-900">Entrar</h2>
							<p class="text-sm text-slate-500 mt-1">Informe suas credenciais de acesso.</p>
						</div>

						@if (erroLogin) {
							<div class="flex items-center gap-3 rounded-xl bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700">
								<svg class="w-4 h-4 shrink-0" fill="currentColor" viewBox="0 0 20 20">
									<path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
								</svg>
								{{ erroLogin }}
							</div>
						}

						<div class="space-y-5">
							<ui-form-field label="E-mail" fieldId="email" [required]="true" [error]="erro('email')">
								<input id="email" formControlName="email" type="email" autocomplete="email"
									placeholder="seu@email.com" [class]="inputClass('email')"/>
							</ui-form-field>

							<ui-form-field label="Senha" fieldId="senha" [required]="true" [error]="erro('senha')"
								hint="Senha de 4 dígitos enviada por e-mail ao se cadastrar">
								<div class="relative">
									<input id="senha" formControlName="senha" [type]="showSenha ? 'text' : 'password'"
										maxlength="4" autocomplete="current-password" placeholder="••••"
										[class]="inputClass('senha') + ' pr-11 tracking-widest text-base'"/>
									<button type="button" (click)="showSenha = !showSenha"
										class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition">
										@if (showSenha) {
											<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
												<path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/>
											</svg>
										} @else {
											<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
												<path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
												<path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
											</svg>
										}
									</button>
								</div>
							</ui-form-field>
						</div>

						<div class="flex items-center justify-end pt-1">
							<ui-button type="submit" variant="primary" [loading]="loading">
								Entrar
							</ui-button>
						</div>

					</form>
				</div>
			</section>

		</div>
	</div>
</div>
