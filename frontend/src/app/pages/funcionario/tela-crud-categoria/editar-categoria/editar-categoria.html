<div class="min-h-screen bg-slate-50 flex">
  <ui-sidebar
    panelLabel="Painel do Funcionário"
    [menuItems]="menuItemsFuncionario"
    (logoutClicked)="logout()" />

  <main class="flex-1 p-4 sm:p-6 lg:p-8">
    <div class="max-w-4xl mx-auto space-y-6">
      <header class="bg-white rounded-3xl border border-slate-200 p-6 sm:p-8">
        <p class="text-xs uppercase tracking-widest text-teal-700 font-semibold">{{ titulo }}</p>
        <h1 class="text-2xl sm:text-3xl font-black text-slate-900 mt-1">Gerenciar categoria</h1>
        <p class="text-sm text-slate-500 mt-2">Preencha o nome para criar ou atualizar uma categoria.</p>
      </header>

      <section class="bg-white rounded-3xl border border-slate-200 p-6 sm:p-8">
        <form [formGroup]="form" (ngSubmit)="salvar()" class="space-y-6">
          <ui-form-field
            label="Nome da categoria"
            fieldId="nome"
            [required]="true"
            [error]="erroNome()"
          >
            <input
              id="nome"
              type="text"
              formControlName="nome"
              class="mt-1 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
              placeholder="Digite o nome da categoria"
            />
          </ui-form-field>

          <div class="flex flex-wrap gap-3">
            <ui-button type="submit" variant="primary" size="md" [loading]="carregando">Salvar</ui-button>
            <ui-button type="button" variant="secondary" size="md" (clicked)="cancelar()">Cancelar</ui-button>
          </div>
        </form>
      </section>
    </div>
  </main>
</div>
