<div class="min-h-screen bg-slate-50 flex">

  <!-- MENU LATERAL -->
  <ui-sidebar
    panelLabel="Painel do Funcionário"
    [menuItems]="menuItemsFuncionario"
    (logoutClicked)="logout()" />

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="flex-1 p-8">

    <div class="max-w-6xl mx-auto">

      <div class="mb-6">
        <h2 class="text-2xl font-bold text-slate-900">
          Solicitações Abertas
        </h2>

        <p class="text-sm text-slate-500">
          Solicitações que necessitam de atenção imediata.
        </p>
      </div>

      <!-- CARD -->
      <div class="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden">

        <div class="p-6">

          <div class="overflow-x-auto">

            <table class="w-full text-sm">

              <thead>
                <tr class="border-b border-slate-200 text-left text-slate-500 uppercase text-xs tracking-wider">
                  <th class="py-3">Data / Hora</th>
                  <th class="py-3">Cliente</th>
                  <th class="py-3">Produto</th>
                </tr>
              </thead>

              <tbody class="divide-y divide-slate-100">

                <tr class="hover:bg-slate-50">
                  <td class="py-3 font-medium text-slate-700">
                    16/03/2026 10:20
                  </td>

                  <td class="py-3 text-slate-700">
                    João da Silva
                  </td>

                  <td class="py-3 text-slate-600">
                    Notebook Dell Inspiron 15
                  </td>
                </tr>

                <tr class="hover:bg-slate-50">
                  <td class="py-3 font-medium text-slate-700">
                    16/03/2026 11:05
                  </td>

                  <td class="py-3 text-slate-700">
                    Maria Oliveira
                  </td>

                  <td class="py-3 text-slate-600">
                    Monitor LG UltraWide 29
                  </td>
                </tr>

                <tr class="hover:bg-slate-50">
                  <td class="py-3 font-medium text-slate-700">
                    16/03/2026 11:45
                  </td>

                  <td class="py-3 text-slate-700">
                    Carlos Pereira
                  </td>

                  <td class="py-3 text-slate-600">
                    Teclado Mecânico Gamer RGB
                  </td>
                </tr>

              </tbody>

            </table>

          </div>

        </div>

      </div>

    </div>

  </main>

</div>
